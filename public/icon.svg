<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="80%" r="85%">
      <stop offset="0%" stop-color="#ff7b1a" />
      <stop offset="40%" stop-color="#b8325a" />
      <stop offset="75%" stop-color="#3b1b54" />
      <stop offset="100%" stop-color="#0a0518" />
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffeaa7" />
      <stop offset="75%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#ee5253" />
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc048" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff7b1a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff7b1a" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky Dome -->
  <rect width="512" height="512" rx="108" fill="url(#skyGrad)" />

  <!-- Stars in Twilight Sky -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="80" cy="90" r="2.2" />
    <circle cx="160" cy="65" r="1.8" />
    <circle cx="240" cy="110" r="2.5" />
    <circle cx="360" cy="75" r="2" />
    <circle cx="440" cy="120" r="1.8" />
    <circle cx="120" cy="150" r="1.5" />
    <circle cx="410" cy="180" r="2.2" />
  </g>

  <!-- High Cirrus Cloud Streaks -->
  <path d="M 40 180 Q 180 150, 320 170 Q 420 185, 480 160 Q 360 200, 200 190 Z" fill="#d980fa" opacity="0.45" />
  <path d="M 20 230 Q 150 200, 300 220 Q 440 235, 500 210 Q 340 250, 140 240 Z" fill="#f368e0" opacity="0.35" />

  <!-- Sun Disc Halo -->
  <circle cx="350" cy="330" r="140" fill="url(#sunHalo)" filter="url(#glow)" />

  <!-- Radiant Sunrise Disc -->
  <circle cx="350" cy="330" r="68" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Distant Forest Horizon Silhouette -->
  <path d="M 0 350 Q 80 340, 160 345 T 320 342 T 420 346 T 512 344 L 512 512 L 0 512 Z" fill="#1e1026" />

  <!-- Receding Perspective Dirt Road -->
  <path d="M 120 512 Q 220 440, 340 355 L 360 355 Q 360 440, 390 512 Z" fill="#3d2314" opacity="0.95" />
  <path d="M 140 512 Q 230 440, 345 355 L 355 355 Q 352 440, 370 512 Z" fill="#ff9f43" opacity="0.25" />

  <!-- Sacred Banyan Tree Silhouette on Right -->
  <g fill="#100713">
    <!-- Trunk & Canopy -->
    <path d="M 440 512 Q 430 420, 410 380 Q 450 320, 480 340 Q 520 370, 512 512 Z" />
    <!-- Sprawling Roots -->
    <path d="M 430 460 Q 390 480, 340 500 Q 390 495, 430 475 Z" />
    <path d="M 440 440 Q 400 460, 370 485 Q 410 470, 440 455 Z" />
    <!-- Canopy Foliage Masses -->
    <circle cx="450" cy="330" r="55" />
    <circle cx="490" cy="310" r="45" />
    <circle cx="410" cy="340" r="40" />
    <!-- Hanging Aerial Roots -->
    <line x1="410" y1="350" x2="406" y2="460" stroke="#100713" stroke-width="3" />
    <line x1="430" y1="340" x2="426" y2="440" stroke="#100713" stroke-width="2.5" />
    <line x1="465" y1="345" x2="460" y2="455" stroke="#100713" stroke-width="2.5" />
  </g>

  <!-- Left Autumn Tree -->
  <g fill="#100713">
    <path d="M 40 512 Q 55 430, 70 380 Q 40 370, 20 390 L 0 512 Z" />
    <!-- Autumn Leaf Puffs -->
    <circle cx="70" cy="350" r="26" fill="#ee5253" />
    <circle cx="95" cy="335" r="28" fill="#ff793f" />
    <circle cx="50" cy="330" r="22" fill="#d63031" />
  </g>

  <!-- Golden Edge Border -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#ff7b1a" stroke-width="6" opacity="0.6" />
</svg>
